{% extends "base.html" %}
{% block title %}{{ title }} | {{ content.profile.first_name }} {{ content.profile.last_name }}{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="crumbs"><a href="{{ url_for('public.index') }}">← Home</a></div>
<section class="section prose" aria-labelledby="h-legal">
  <h2 id="h-legal">{{ title }}</h2>
  {% for para in content.legal[key] | paragraphs %}<p>{{ para }}</p>{% endfor %}
</section>
{% endblock %}

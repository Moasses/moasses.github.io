{% extends "admin/base.html" %}
{% block title %}Sign in{% endblock %}
{% block auth %}
<form method="post" class="card" autocomplete="on">
  <h1>Sign in</h1>
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required maxlength="100" autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required maxlength="256">
  <button class="btn">Continue</button>
  <p class="muted">Step 1 of 2 · then a code from your authenticator app.</p>
</form>
{% endblock %}
